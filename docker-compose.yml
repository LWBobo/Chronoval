name: chronoval

# Chronoval —— 个人摄影画廊
#
# 单服务全栈：Nuxt 4 前端 + Nitro 后端由同一容器托管。
#
# 挂载目录的角色（重要）：
#
# ▍/app/data —— 程序运行目录（可写，必需）
#   ./data -> /app/data
#   SQLite 数据库、会话密钥、配置在此。备份/迁移只需复制 ./data。
#
# ▍/app/storage —— 本地存储 + 统一缩略图目录（可写，必需；纯存储、绝不自动扫描）
#   ./storage -> /app/storage
#   - 上传的加密照片/视频实时写入 /app/storage/photos（prefix=photos/），上传即显示、无需扫描。
#   - 所有缩略图（含外部扫描库）统一写入 /app/storage/thumbnails/，外部库目录保持纯只读原图。
#   该目录不会被当作相册自动扫描。
#
# ▍/app/library —— 外部扫描库（可选，唯一自动识别来源；默认不挂载）
#   需要时把下方 volumes 中备注的挂载取消注释即可（先 mkdir -p data/library）。
#   每个相册 = /app/library 下一个子目录，在界面按容器内路径手动添加为扫描库。
#   手动放图即被自动识别；缩略图统一写入内部存储 /app/storage/thumbnails/。
#
# 结论：默认必需挂载只有 2 个（/app/data 与 /app/storage）；只有额外挂载的外部扫描库
#       （如 /app/library 或其它目录）才会触发「放图自动识别」，上传/存储目录纯作存储、不走扫描。

# 快速开始：
#   1) cp .env.example .env 并按需编辑（至少设置 NUXT_SESSION_PASSWORD）
#   2) docker compose up -d （默认拉取 GHCR 已构建镜像 ghcr.io/xiaomengr/chronoval:latest）
#      仅当你想从源码自己构建时才用：docker compose up -d --build
#   3) 打开 http://localhost:3000 即可上传照片
#   如需外部扫描库：先 mkdir -p data/library 并在下方 volumes 取消注释挂载，
#      然后到「扫描库」里添加容器内目录（如 /app/library）即可放图自动识别

services:
  chronoval:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lwbobo/chronoval:1.7
    container_name: chronoval
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，如需换端口改左侧即可
      - '3000:3000'
    env_file:
      # 从 .env 读取配置（管理员账号、会话密钥、站点信息等）。
      # 本地存储与媒体库的默认值已固化在镜像内（Dockerfile ENV），无需在此重复配置。
      - .env
    environment:
      # 覆盖 .env 里的地址：同一 Compose 网络内用服务名访问侧车。
      - CHRONOVAL_ML_URL=http://chronoval-ml:3003
    depends_on:
      chronoval-ml:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri # Intel 或 AMD GPU 硬件转码
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # 程序运行目录：数据库 + 配置（必需，可写）
      - ./data:/app/data
      # 本地存储 + 统一缩略图目录（必需，可写，上传落 photos/，纯存储不扫描）
      - ./storage:/app/storage
      # ── 可选：外部扫描库（默认不挂载）────────────────────────────
      # 需要“放图自动识别相册”时取消下面一行注释，并先执行：mkdir -p data/library
      - /vol2/1000/photos/shares:/app/library
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fnosnet

  # CLIP / 人脸 / OCR。镜像已在本机构建为 chronoval-ml:1.5（CPU 版 PyTorch）。
  # 模型在首次调用时下载到 ml-cache，大约数百 MB 到 1GB 以上。
  chronoval-ml:
    image: chronoval-ml:1.7
    container_name: chronoval-ml
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      - CACHE_DIR=/cache
      - PORT=3003
      - CLIP_FN_IMG=/opt/models/fnos/img2vec.onnx
      - CLIP_FN_TXT=/opt/models/fnos/txt2vec.onnx
      - CLIP_FN_SP=/opt/models/fnos/sp.model
      - CLIP_MODEL_NAME=fnos
      - CLIP_PRETRAINED=img2vec-large-1.0.0
      - CLIP_DIM=1024
    devices:
      - /dev/dri:/dev/dri # Intel 或 AMD GPU 硬件转码
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./ml-cache:/cache
      # 飞牛图文权重的本地副本，只读挂载，不打进镜像。
      - /home/liuwb/test/Chronoval-liuwb/chronoval-ml/models/fnos/img2vec.onnx:/opt/models/fnos/img2vec.onnx:ro
      - /home/liuwb/test/Chronoval-liuwb/chronoval-ml/models/fnos/txt2vec.onnx:/opt/models/fnos/txt2vec.onnx:ro
      - /home/liuwb/test/Chronoval-liuwb/chronoval-ml/models/fnos/sp.model:/opt/models/fnos/sp.model:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3003/ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fnosnet

# 飞牛已有网络，两个容器必须在同一网络里，主服务才能解析 chronoval-ml。
networks:
  fnosnet:
    external: true

volumes:
  ml-cache:
